    const skillHolders = [];
    ksTeams.forEach(t=>[...t.leaders,...t.members].forEach(m=>{
      const isLdr=typeof m==='string'&&m.startsWith('leder_');
      const uid=isLdr?m:'member_'+m.replace(/\s/g,'_').toLowerCase();
      if(getMemberSkills(uid).includes(skill)) skillHolders.push(isLdr?getUserDisplayName(m):m);
    }));
    if(skillHolders.length) {
      html += '<tr><td colspan="'+(slots.length+1+(isDriftUser?1:0))+'" style="padding:3px 12px 6px;font-size:10px;color:#6b7280;font-style:italic">'+skillHolders.join(', ')+'</td></tr>';
    }
  });
  html += '</tbody></table></div></div>';
  return html;
}


function renderTSLunch(ds, slots) {
  let html = '<div style="background:var(--surface);border-radius:14px;box-shadow:var(--shadow);margin-bottom:24px;overflow:hidden">'
    + '<div style="background:#00a86b;color:#fff;padding:12px 20px;font-size:15px;font-weight:800">🖥️ Teknisk Support – Frokost</div>'
    + '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">'
    + '<thead><tr>';

  const isDriftTS = teams.find(t=>t.id===currentUser.teamId)?.category==='Drift';
  slots.forEach(s => {
    html += '<th style="background:#d6f0e4;padding:6px 5px;text-align:center;font-weight:700;border-bottom:2px solid #a0ccb8;min-width:110px">';
    if(isDriftTS) {
      html += '<div style="display:flex;align-items:center;justify-content:center;gap:4px">'
        + '<button onclick="removeLunchSlot(\'ts\',\''+s+'\',\''+ds+'\',false)" title="Fjern tidsrum" style="background:#fee2e2;border:1.5px solid #fca5a5;border-radius:5px;color:#ef4444;font-size:10px;font-weight:700;cursor:pointer;padding:2px 6px;font-family:inherit">✕</button>'
        + '<span style="font-size:12px;font-weight:800">'+s+'</span>'
        + '</div>';
    } else {
      html += '<span style="white-space:nowrap;font-size:11px">'+s+'</span>';
    }
    html += '</th>';
  });
  if(isDriftTS) {
    html += '<th style="background:#d6f0e4;padding:6px 8px;text-align:center;border-bottom:2px solid #a0ccb8;min-width:150px;vertical-align:middle">'
      + '<div style="display:flex;flex-direction:column;gap:4px;align-items:stretch">'
      + '<button onclick="addLunchSlot(\'ts\',\''+ds+'\')" style="background:#00a86b;color:#fff;border:none;border-radius:6px;padding:5px 8px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">＋ Tilføj tidsrum</button>'
      + '</div></th>';
  }

  html += '</tr></thead><tbody>';
  html += '<tr>';
  html += renderSlotColumn(ds, 'ts', slots);
  html += '</tr>';
  html += '</tbody></table></div></div>';
  return html;
}


function getUserDisplayName(uid) {
  const demoNames = {
    'leder_t0':'Helle Bergstrøm','leder_t1':'Victor Reinhold Hjelm','leder_t2':'Kit Desiré Jensen',
    'leder_t3':'Nicolai Gamsbøll-Havmand','leder_t4':'Mikkel Sander','leder_t5':'David Flenstrøm',
    'leder_t6':'Martin Larsen','leder_t7':'Marianne Hansen'
  };
  if(demoNames[uid]) return demoNames[uid];
  return uid;
}


function openDayEdit() {
  const today = new Date(); today.setHours(0,0,0,0);
  const ds = dateStr(today);
  initDayOverride('ks', ds);
  initDayOverride('ts', ds);

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9000;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto';

  function buildContent() {
    overlay.innerHTML = '';
    const box = document.createElement('div');
    box.style.cssText = 'background:var(--surface);border-radius:16px;padding:28px;max-width:700px;width:100%;margin:auto';

    box.innerHTML = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">'
      + '<h2 style="font-size:18px;font-weight:800;margin:0">✏️ Tilpas dagens skema</h2>'
      + '<button onclick="this.closest(\'div[style*=inset]\').remove()" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-muted)">✕</button>'
      + '</div>';

    ['ks','ts'].forEach(section => {
      const label = section==='ks' ? '☕ Kundeservice' : '🖥️ Teknisk Support';
      const ov = lunchDayOverride[ds][section];
      const sec = document.createElement('div');
      sec.style.cssText = 'margin-bottom:28px';
      sec.innerHTML = '<h3 style="font-size:14px;font-weight:800;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--border)">'+label+'</h3>';

      const grid = document.createElement('div');
      grid.style.cssText = 'display:flex;flex-direction:column;gap:8px';

      function refreshGrid() {
        grid.innerHTML = '';
        ov.slots.forEach(slot => {
          const row = document.createElement('div');
          row.style.cssText = 'display:flex;align-items:center;gap:10px;background:#f9fafb;border-radius:8px;padding:8px 12px';

          const slotLbl = document.createElement('span');
          slotLbl.style.cssText = 'font-weight:700;font-size:13px;min-width:120px';
          slotLbl.textContent = slot;

          const capLbl = document.createElement('span');
          capLbl.style.cssText = 'font-size:12px;color:var(--text-muted)';
          capLbl.textContent = 'Pladser:';

          const minus = document.createElement('button');
          minus.textContent = '−';
          minus.style.cssText = 'width:28px;height:28px;border-radius:6px;border:1.5px solid var(--border);background:#fff;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0';
          const capNum = document.createElement('span');
          capNum.style.cssText = 'font-size:15px;font-weight:800;min-width:24px;text-align:center';
          capNum.textContent = ov.capacity[slot] ?? getLunchCapacity(section, slot);
          const plus = document.createElement('button');
          plus.textContent = '+';
          plus.style.cssText = minus.style.cssText;

          minus.onclick = () => {
            const cur = ov.capacity[slot] ?? getLunchCapacity(section, slot);
            if(cur > 1) { ov.capacity[slot] = cur-1; capNum.textContent = cur-1; }
          };
          plus.onclick = () => {
            const cur = ov.capacity[slot] ?? getLunchCapacity(section, slot);
            ov.capacity[slot] = cur+1; capNum.textContent = cur+1;
          };

          const del = document.createElement('button');
          del.textContent = '🗑';
          del.title = 'Fjern tidsrum';
          del.style.cssText = 'margin-left:auto;background:none;border:none;font-size:16px;cursor:pointer;padding:2px 6px;border-radius:6px';
          del.onclick = () => {
            ov.slots = ov.slots.filter(s=>s!==slot);
            delete ov.capacity[slot];
            // remove any bookings for this slot today
            const slotId = ds+'_'+lunchSlotKey(slot);
            if(lunchBookings[ds]?.[section]) delete lunchBookings[ds][section][slotId];
            refreshGrid();
            renderLunch();
          };

          row.appendChild(slotLbl);
          row.appendChild(capLbl);
          row.appendChild(minus);
          row.appendChild(capNum);
          row.appendChild(plus);
          row.appendChild(del);
          grid.appendChild(row);
        });

        // Add new slot row
        const addRow = document.createElement('div');
        addRow.style.cssText = 'display:flex;align-items:center;gap:8px;margin-top:6px';
        const inp = document.createElement('input');
        inp.type='text'; inp.placeholder='HH:MM-HH:MM';
        inp.style.cssText = 'border:1.5px solid var(--border);border-radius:7px;padding:6px 10px;font-size:13px;font-family:inherit;width:130px';
        const addBtn = document.createElement('button');
        addBtn.textContent = '+ Tilføj tidsrum';
        addBtn.style.cssText = 'background:var(--navy);color:#fff;border:none;border-radius:7px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit';
        addBtn.onclick = () => {
          const val = inp.value.trim();
          if(!/^\d{2}:\d{2}-\d{2}:\d{2}$/.test(val)){showToast('Format: HH:MM-HH:MM','error');return;}
          if(ov.slots.includes(val)){showToast('Tidsrummet findes allerede','error');return;}
          // Insert sorted
          ov.slots.push(val);
          ov.slots.sort();
          ov.capacity[val] = 3;
          inp.value = '';
          refreshGrid();
          renderLunch();
        };
        addRow.appendChild(inp);
        addRow.appendChild(addBtn);
        grid.appendChild(addRow);
      }

      refreshGrid();
      sec.appendChild(grid);
      box.appendChild(sec);
    });

    const closeBtn = document.createElement('button');
    closeBtn.textContent = 'Luk';
    closeBtn.style.cssText = 'width:100%;padding:11px;border-radius:9px;background:var(--navy);color:#fff;border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit';
    closeBtn.onclick = () => overlay.remove();
    box.appendChild(closeBtn);

    overlay.appendChild(box);
  }

  buildContent();
  overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };
  document.body.appendChild(overlay);
}

function openLunchConfig() {
  const nl = String.fromCharCode(10);
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9000;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto';

  const box = document.createElement('div');
  box.style.cssText = 'background:var(--surface);border-radius:16px;padding:28px;width:100%;max-width:620px;box-shadow:0 8px 40px rgba(0,0,0,.3);margin:auto';

  function buildSlotRows(section, slots, capacityObj) {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'border:1.5px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px';
    slots.forEach((slot,i) => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:'+(i<slots.length-1?'1px solid var(--border)':'none');
      row.dataset.slot = slot;
      const cap = capacityObj[slot] !== undefined ? capacityObj[slot] : 3;

      const slotLbl = document.createElement('span');
      slotLbl.style.cssText = 'flex:1;font-weight:600;font-size:13px';
      slotLbl.textContent = slot;

      const capLbl = document.createElement('span');
      capLbl.style.cssText = 'font-size:12px;color:#666';
      capLbl.textContent = 'Pladser:';

      const minus = document.createElement('button');
      minus.textContent = '−';
      minus.style.cssText = 'width:28px;height:28px;border-radius:6px;border:1.5px solid var(--border);background:var(--surface);font-size:16px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center';

      const capNum = document.createElement('span');
      capNum.style.cssText = 'font-weight:800;font-size:15px;min-width:24px;text-align:center';
      capNum.textContent = cap;
      capNum.dataset.cap = cap;

      const plus = document.createElement('button');
      plus.textContent = '+';
      plus.style.cssText = minus.style.cssText;

      minus.onclick = () => {
        let v = parseInt(capNum.dataset.cap);
        if(v > 1) { v--; capNum.dataset.cap = v; capNum.textContent = v; }
      };
      plus.onclick = () => {
        let v = parseInt(capNum.dataset.cap);
        if(v < 20) { v++; capNum.dataset.cap = v; capNum.textContent = v; }
      };

      const delBtn = document.createElement('button');
      delBtn.textContent = '🗑';
      delBtn.title = 'Fjern tidspunkt';
      delBtn.style.cssText = 'border:none;background:none;cursor:pointer;font-size:14px;opacity:.5;padding:2px 4px';
      delBtn.onclick = () => row.remove();

      row.appendChild(slotLbl);
      row.appendChild(capLbl);
      row.appendChild(minus);
      row.appendChild(capNum);
      row.appendChild(plus);
      row.appendChild(delBtn);
      wrap.appendChild(row);
    });
    return wrap;
  }

  function buildSection(title, section, slots, capacityObj, addKey) {
    const sec = document.createElement('div');
    sec.style.marginBottom = '20px';
    const h = document.createElement('h4');
    h.style.cssText = 'margin:0 0 8px;font-size:14px;color:var(--text)';
    h.textContent = title;
    sec.appendChild(h);
    const rows = buildSlotRows(section, slots, capacityObj);
    rows.dataset.section = section;
    rows.dataset.key = addKey;
    sec.appendChild(rows);

    // Add new slot
    const addRow = document.createElement('div');
    addRow.style.cssText = 'display:flex;gap:8px;margin-top:6px';
    const inp = document.createElement('input');
    inp.placeholder = 'HH:MM-HH:MM';
    inp.style.cssText = 'flex:1;padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px';
    const addBtn = document.createElement('button');
    addBtn.textContent = '+ Tilføj tidspunkt';
    addBtn.style.cssText = 'padding:7px 14px;border-radius:8px;border:none;background:#0073b6;color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer';
    addBtn.onclick = () => {
      const val = inp.value.trim();
      if(!/^\d{2}:\d{2}-\d{2}:\d{2}$/.test(val)){ alert('Format: HH:MM-HH:MM'); return; }
      const newRow = document.createElement('div');
      newRow.style.cssText = 'display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--border)';
      newRow.dataset.slot = val;
      const lbl = document.createElement('span'); lbl.style.cssText='flex:1;font-weight:600;font-size:13px'; lbl.textContent=val;
      const cl = document.createElement('span'); cl.style.cssText='font-size:12px;color:#666'; cl.textContent='Pladser:';
      const m2 = document.createElement('button'); m2.textContent='−'; m2.style.cssText=addBtn.style.cssText.replace('#0073b6','var(--surface)').replace('color:#fff','color:var(--text)').replace('font-weight:700',''); m2.style.border='1.5px solid var(--border)'; m2.style.width='28px'; m2.style.height='28px';
      const cn = document.createElement('span'); cn.style.cssText='font-weight:800;font-size:15px;min-width:24px;text-align:center'; cn.textContent='3'; cn.dataset.cap='3';
      const p2 = document.createElement('button'); p2.textContent='+'; p2.style.cssText=m2.style.cssText;
      m2.onclick=()=>{let v=parseInt(cn.dataset.cap);if(v>1){v--;cn.dataset.cap=v;cn.textContent=v;}};
      p2.onclick=()=>{let v=parseInt(cn.dataset.cap);if(v<20){v++;cn.dataset.cap=v;cn.textContent=v;}};
      const db = document.createElement('button'); db.textContent='🗑'; db.style.cssText='border:none;background:none;cursor:pointer;font-size:14px;opacity:.5;padding:2px 4px'; db.onclick=()=>newRow.remove();
      newRow.appendChild(lbl); newRow.appendChild(cl); newRow.appendChild(m2); newRow.appendChild(cn); newRow.appendChild(p2); newRow.appendChild(db);
      rows.appendChild(newRow);
      inp.value='';
    };
    addRow.appendChild(inp); addRow.appendChild(addBtn);
    sec.appendChild(addRow);
    return {sec, rows};
  }

  const title = document.createElement('h3');
  title.style.cssText = 'margin:0 0 20px;font-size:18px';
  title.textContent = '⚙ Tilpas frokosttidspunkter & pladser';
  box.appendChild(title);

  const {sec:ksEl, rows:ksRows} = buildSection('☕ Kundeservice', 'ks', lunchConfig.ks.slots, lunchConfig.ks.capacity, 'slots');
  const {sec:tsWDEl, rows:tsWDRows} = buildSection('🖥️ Teknisk Support – Hverdage', 'ts', lunchConfig.ts.weekdaySlots, lunchConfig.ts.capacity, 'weekdaySlots');
  const {sec:tsWEEl, rows:tsWERows} = buildSection('🖥️ Teknisk Support – Weekend', 'ts', lunchConfig.ts.weekendSlots, lunchConfig.ts.capacity, 'weekendSlots');
  box.appendChild(ksEl); box.appendChild(tsWDEl); box.appendChild(tsWEEl);

  function readRows(rowsEl) {
    const slots = [];
    const caps = {};
    rowsEl.querySelectorAll('[data-slot]').forEach(r => {
      const slot = r.dataset.slot;
      const capEl = r.querySelector('[data-cap]');
      if(slot && capEl) { slots.push(slot); caps[slot] = parseInt(capEl.dataset.cap); }
    });
    return {slots, caps};
  }

  const btns = document.createElement('div');
  btns.style.cssText = 'display:flex;gap:10px;justify-content:flex-end;margin-top:12px';
  const cancel = document.createElement('button');
  cancel.textContent = 'Annuller';
  cancel.style.cssText = 'padding:9px 20px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);font-family:inherit;font-size:14px;cursor:pointer';
  cancel.onclick = () => overlay.remove();
  const save = document.createElement('button');
  save.textContent = 'Gem';
  save.style.cssText = 'padding:9px 20px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer';
  save.onclick = () => {
    const ks = readRows(ksRows);
    const tsWD = readRows(tsWDRows);
    const tsWE = readRows(tsWERows);
    lunchConfig.ks.slots = ks.slots;
    Object.assign(lunchConfig.ks.capacity, ks.caps);
    lunchConfig.ts.weekdaySlots = tsWD.slots;
    lunchConfig.ts.weekendSlots = tsWE.slots;
    Object.assign(lunchConfig.ts.capacity, tsWD.caps, tsWE.caps);
    overlay.remove();
    showToast('Frokostindstillinger gemt ✓','success');
    renderLunch();
  };
  btns.appendChild(cancel); btns.appendChild(save);
  box.appendChild(btns);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}


</script>
